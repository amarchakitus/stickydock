# Builds StickyDock and publishes a GitHub Release when a version tag is pushed:
#   git tag v1.0.2 && git push origin v1.0.2
# The tag must match CFBundleShortVersionString in Info.plist.
#
# Running it manually (Actions → Release → Run workflow):
#   - with a tag (e.g. v1.0.1): builds that tag's source with this version of the
#     workflow and publishes its release. Use this to retry a release after fixing CI,
#     without bumping the app version.
#   - without a tag: signed test build of the chosen branch, uploaded as a workflow
#     artifact; nothing is published.
#
# Requires secrets SIGNING_CERT_P12 / SIGNING_CERT_PASSWORD (see scripts/make_cert.sh)
# so every release is signed with the same certificate and users keep the
# Accessibility permission across updates.
#
# The build job holds the signing key but only a read-only token; the publish job has
# write access but never sees the key. Actions are pinned to commit SHAs.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build and publish (e.g. v1.0.1). Leave empty for a test build."
        required: false
        default: ""

permissions: {}

jobs:
  build:
    runs-on: macos-15
    # Signing secrets live in this environment, which requires approval before the job runs.
    environment: release
    permissions:
      contents: read
    steps:
      - name: Validate tag
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' isn't a version tag like v1.2.3"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Check tag matches app version
        if: github.ref_type == 'tag' || inputs.tag != ''
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Info.plist)
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "::error::Tag $TAG doesn't match Info.plist version $VERSION"
            exit 1
          fi

      - name: Import signing certificate
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if [[ -z "$SIGNING_CERT_P12" || -z "$SIGNING_CERT_PASSWORD" ]]; then
            echo "::error::SIGNING_CERT_P12 / SIGNING_CERT_PASSWORD secrets are missing; refusing to publish an unsigned release"
            exit 1
          fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS=$(openssl rand -hex 16)
          echo "$SIGNING_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC" > /dev/null
          rm "$RUNNER_TEMP/cert.p12"
          # codesign on the runner only finds identities in keychains on the search list.
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: Build
        run: ./build.sh release

      - name: Remove signing keychain
        if: always()
        run: |
          [[ -n "${SIGN_KEYCHAIN:-}" ]] && security delete-keychain "$SIGN_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/cert.p12"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            build/StickyDock-*.dmg
            build/StickyDock-*.zip
            build/SHA256SUMS
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref_type == 'tag' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          # --verify-tag: never create a new tag here; the release must match an existing one.
          gh release create "$TAG" \
            "StickyDock-$VERSION.dmg" "StickyDock-$VERSION.zip" SHA256SUMS \
            --verify-tag \
            --title "StickyDock $VERSION" \
            --generate-notes
