# Builds StickyDock and publishes a GitHub Release when a version tag is pushed:
#   git tag v1.0.1 && git push origin v1.0.1
# The tag must match CFBundleShortVersionString in Info.plist.
#
# Requires secrets SIGNING_CERT_P12 / SIGNING_CERT_PASSWORD (see scripts/make_cert.sh)
# so every release is signed with the same certificate and users keep the
# Accessibility permission across updates.
#
# The build job holds the signing key but only a read-only token; the publish job has
# write access but never sees the key. Actions are pinned to commit SHAs.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: macos-15
    # Signing secrets live in this environment, which requires approval before the job runs.
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag matches app version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Info.plist)
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Info.plist version $VERSION"
            exit 1
          fi

      - name: Import signing certificate
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if [[ -z "$SIGNING_CERT_P12" || -z "$SIGNING_CERT_PASSWORD" ]]; then
            echo "::error::SIGNING_CERT_P12 / SIGNING_CERT_PASSWORD secrets are missing; refusing to publish an unsigned release"
            exit 1
          fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS=$(openssl rand -hex 16)
          echo "$SIGNING_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC" > /dev/null
          rm "$RUNNER_TEMP/cert.p12"
          echo "SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: Build
        run: ./build.sh release

      - name: Remove signing keychain
        if: always()
        run: |
          [[ -n "${SIGN_KEYCHAIN:-}" ]] && security delete-keychain "$SIGN_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/cert.p12"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            build/StickyDock-*.dmg
            build/StickyDock-*.zip
            build/SHA256SUMS
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "StickyDock-$VERSION.dmg" "StickyDock-$VERSION.zip" SHA256SUMS \
            --title "StickyDock $VERSION" \
            --generate-notes
